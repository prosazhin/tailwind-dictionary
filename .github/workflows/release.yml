name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: 22.x
  PACKAGE_NAME: 'tailwind-dictionary'

jobs:
  gate:
    name: Check version
    # workflow_dispatch можно запустить с любой ветки — публикуем только с main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compare local version with npm
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Не удалось прочитать версию из package.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          set +e
          NPM_OUTPUT="$(npm view "$PACKAGE_NAME@$VERSION" version 2>&1)"
          NPM_EXIT=$?
          set -e

          if [ "$NPM_EXIT" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACKAGE_NAME@$VERSION уже опубликована — релиз пропущен"
          elif echo "$NPM_OUTPUT" | grep -q "E404"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACKAGE_NAME@$VERSION ещё не опубликована — публикуем"
          else
            # Реестр недоступен, rate limit и т.п. — молча публиковать нельзя,
            # иначе неизвестное состояние трактуется как «версии нет».
            echo "$NPM_OUTPUT"
            echo "::error::npm view завершился с ошибкой, не связанной с отсутствием версии"
            exit 1
          fi

  release:
    name: Publish
    needs: [gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-fund --no-audit
      - run: npm run lint

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ needs.gate.outputs.version }}'
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
